[project]
name = "hastori"
version = "0.1.0"
description = "Hastori: industrial telemetry platform"
requires-python = ">=3.12,<3.13"
dependencies = [
  "hastori-common",
  "hastori-ingestion",
  "hastori-simulator",
  "hastori-alarm",
  "hastori-api",
]

[dependency-groups]
dev = [
  "ruff>=0.6",
  "mypy>=1.11",
  "pytest>=8",
  "pytest-asyncio>=0.24",
  "types-PyYAML",
  "httpx>=0.27",
  # integration tests without Docker: a real PostgreSQL and a Redis with Lua
  "pgserver>=0.1.4",
  "fakeredis[lua]>=2.26",
  "testcontainers>=4.8",
]

[tool.uv.workspace]
members = [
  "packages/common",
  "services/ingestion",
  "services/simulator",
  "services/alarm",
  "services/api",
]

[tool.uv.sources]
hastori-common = { workspace = true }
hastori-ingestion = { workspace = true }
hastori-simulator = { workspace = true }
hastori-alarm = { workspace = true }
hastori-api = { workspace = true }

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "SIM"]

[tool.mypy]
strict = true
python_version = "3.12"
explicit_package_bases = true
mypy_path = "packages/common/src:services/ingestion/src:services/simulator/src:services/alarm/src:services/api/src:scripts"

[[tool.mypy.overrides]]
module = ["aiomqtt.*", "aio_pika.*", "pwdlib.*", "asyncpg.*", "docker.*", "testcontainers.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["packages", "services", "tests"]
# Testcontainers tests need Docker: `make test-integration` (pytest -m integration)
addopts = ["-m", "not integration"]
markers = ["integration: real TimescaleDB and RabbitMQ in containers (needs Docker)"]

[tool.ruff.lint.isort]
known-first-party = [
  "hastori_common",
  "hastori_ingestion",
  "hastori_simulator",
  "hastori_alarm",
  "hastori_api",
]
