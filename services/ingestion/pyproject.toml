[project]
name = "hastori-ingestion"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "hastori-common",
  # aiomqtt/paho: the ack path uses paho's client (`_client.ack`, `manual_ack_set`), which is not
  # public API. Upper bounds make an upgrade a conscious step; test_real_ack_* guards it.
  "aiomqtt>=2.3,<3",
  "paho-mqtt>=2.1,<3",
  "asyncpg>=0.29",
  "aio-pika>=9.4",
  "redis>=5.2",
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "prometheus-client>=0.20",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hastori_ingestion"]
