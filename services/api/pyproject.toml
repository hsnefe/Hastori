[project]
name = "hastori-api"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "hastori-common",
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "pyjwt>=2.9",
  "redis>=5.2",
  "tzdata",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hastori_api"]
