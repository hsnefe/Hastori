[project]
name = "hastori-alarm"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "hastori-common",
  "aio-pika>=9.4",
  "asyncpg>=0.29",
  "redis>=5.2",
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "prometheus-client>=0.20",
  "tzdata",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hastori_alarm"]
