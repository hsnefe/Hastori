[project]
name = "hastori-simulator"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "hastori-common",
  "aiomqtt>=2.3",
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hastori_simulator"]
