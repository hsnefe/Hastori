[project]
name = "hastori-common"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "sqlalchemy[asyncio]>=2.1",
  "asyncpg>=0.29",
  "alembic>=1.13",
  "pyyaml>=6",
  "pwdlib[argon2]>=0.2",
  "cryptography>=50.0.2",
  "aio-pika>=9.4",
  "uvicorn>=0.30",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hastori_common"]
