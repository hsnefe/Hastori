name: hastori

# Images are pinned to exact versions: a floating tag can change broker behaviour under you.
services:
  timescaledb:
    image: timescale/timescaledb:2.17.2-pg17
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - tsdb-data:/var/lib/postgresql/data
      - ./infra/timescaledb/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      # -h 127.0.0.1: during first-time init the image runs a temporary server that listens on
      # the unix socket only; a socket check would report "healthy" before the real server is up.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  mosquitto:
    image: eclipse-mosquitto:2.1.2-alpine
    environment:
      MQTT_HEALTH_USER: ${MQTT_HEALTH_USER}
    ports:
      - "127.0.0.1:8883:8883"
    volumes:
      - ./infra/mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      # Only what the broker needs. The CA private key lives elsewhere (infra/mosquitto/ca-private).
      - ./infra/mosquitto/certs/ca.crt:/mosquitto/certs/ca.crt:ro
      - ./infra/mosquitto/certs/server.crt:/mosquitto/certs/server.crt:ro
      - ./infra/mosquitto/certs/server.key:/mosquitto/certs/server.key:ro
      # passwd + acl, written with the right owner and mode by `make mqtt-auth`
      - mosquitto-auth:/mosquitto/auth:ro
      - mosquitto-data:/mosquitto/data
    secrets:
      - mqtt_health_password
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          mosquitto_sub -h localhost -p 8883 --cafile /mosquitto/certs/ca.crt
          -u $$MQTT_HEALTH_USER -P "$$(cat /run/secrets/mqtt_health_password)"
          -t '$$SYS/broker/uptime' -C 1 -W 3
      interval: 10s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:4.3.6-management
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    ports:
      - "127.0.0.1:5672:5672"
      - "127.0.0.1:15672:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:7.4.11-alpine
    # The password is read from a compose secret, not an environment variable (`docker inspect`
    # shows those). `user:` makes the image entrypoint skip its chown + privilege drop, which
    # would need capabilities this container does not have.
    user: "999:1000"
    command:
      - sh
      - -c
      - >-
        exec redis-server --requirepass "$$(cat /run/secrets/redis_password)"
        --appendonly yes --appendfsync everysec
        --maxmemory 96mb --maxmemory-policy noeviction
    secrets:
      - redis_password
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", 'REDISCLI_AUTH="$$(cat /run/secrets/redis_password)" redis-cli ping | grep -q PONG']
      interval: 10s
      timeout: 5s
      retries: 20
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    read_only: true
    tmpfs: [/tmp]
    mem_limit: 160m
    restart: unless-stopped

  migrate:
    build:
      context: .
      dockerfile: services/ingestion/Dockerfile
    command: ["alembic", "upgrade", "head"]
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@timescaledb:5432/${POSTGRES_DB}
    depends_on:
      timescaledb:
        condition: service_healthy
    # A failed run (database not accepting connections yet) is retried; later services wait for
    # a successful exit.
    restart: on-failure:5
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    read_only: true
    tmpfs: [/tmp]

  ingestion:
    build:
      context: .
      dockerfile: services/ingestion/Dockerfile
    # No env_file: each service gets only the variables it needs, so a compromised container
    # does not hold every secret (the device secret derives every device password).
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@timescaledb:5432/${POSTGRES_DB}
      MQTT_HOST: mosquitto
      MQTT_PORT: "8883"
      MQTT_CA_FILE: /certs/ca.crt
      MQTT_INGESTION_USER: ${MQTT_INGESTION_USER}
      MQTT_INGESTION_PASSWORD: ${MQTT_INGESTION_PASSWORD}
      RABBITMQ_URL: amqp://${RABBITMQ_USER}:${RABBITMQ_PASSWORD}@rabbitmq:5672/
      # Live events for the screens: best effort, so ingestion does not wait for Redis to start.
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      INGEST_HTTP_PORT: "8001"
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      # The broker uses the MQTT user name as the client id (use_username_as_clientid), so this
      # value only labels the client. A second replica needs its own MQTT user (and ACL).
      INGEST_CLIENT_ID: ingestion
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    read_only: true
    tmpfs: [/tmp]
    mem_limit: 512m
    # SIGTERM drains the queue (up to INGEST_SHUTDOWN_DEADLINE_S = 20 s) before exiting.
    stop_grace_period: 40s
    ports:
      - "127.0.0.1:8001:8001"
    volumes:
      - ./infra/mosquitto/certs/ca.crt:/certs/ca.crt:ro
    depends_on:
      migrate:
        condition: service_completed_successfully
      mosquitto:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      # /healthz fails (503) when a background loop has died; the process then also exits.
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/healthz')"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  alarm:
    build:
      context: .
      dockerfile: services/alarm/Dockerfile
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@timescaledb:5432/${POSTGRES_DB}
      RABBITMQ_URL: amqp://${RABBITMQ_USER}:${RABBITMQ_PASSWORD}@rabbitmq:5672/
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      ALARM_HTTP_PORT: "8003"
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    read_only: true
    tmpfs: [/tmp]
    mem_limit: 256m
    # SIGTERM finishes the message in hand (up to ALARM_SHUTDOWN_DEADLINE_S = 20 s of database
    # retries) before exiting; whatever is not acked is redelivered.
    stop_grace_period: 30s
    ports:
      - "127.0.0.1:8003:8003"
    depends_on:
      migrate:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      # /healthz fails (503) when a background loop has died; the process then also exits.
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8003/healthz')"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: services/api/Dockerfile
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@timescaledb:5432/${POSTGRES_DB}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      JWT_SECRET: ${JWT_SECRET}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      # Origins a browser may open the WebSocket from: the packaged app (8080) and
      # `make web-dev` (3000).
      WS_ALLOWED_ORIGINS: ${WS_ALLOWED_ORIGINS:-http://127.0.0.1:8080,http://localhost:8080,http://127.0.0.1:3000,http://localhost:3000}
      API_HTTP_PORT: "8000"
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    read_only: true
    tmpfs: [/tmp]
    mem_limit: 384m
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz')"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  web:
    build:
      context: ./web
      args:
        # Only matters if this server is reached directly; Caddy sends /api/* to the API itself.
        API_ORIGIN: http://api:8000
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    read_only: true
    # Next writes its fetch/image cache under .next/cache
    tmpfs: [/tmp, "/app/.next/cache:uid=10001"]
    mem_limit: 256m
    # No published port: Caddy is the single entry. The browser never talks to this server for
    # data; it serves the page shell and the scripts.
    expose: ["3000"]
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  caddy:
    image: caddy:2.11.4-alpine
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    # The caddy binary carries the file capability cap_net_bind_service; with every capability
    # dropped the kernel refuses to exec it. It listens on 8080 and never binds a low port.
    cap_add: [NET_BIND_SERVICE]
    read_only: true
    tmpfs: [/data, /config, /tmp]
    mem_limit: 128m
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ./infra/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_healthy
    healthcheck:
      # Through the proxy to the page: proves Caddy, the web server behind it and the route.
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/login"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  simulator:
    profiles: ["sim"]
    build:
      context: .
      dockerfile: services/simulator/Dockerfile
    environment:
      MQTT_HOST: mosquitto
      MQTT_PORT: "8883"
      MQTT_CA_FILE: /certs/ca.crt
      MQTT_DEVICE_SECRET: ${MQTT_DEVICE_SECRET}
      SIM_SEED: ${SIM_SEED:-42}
      SIM_CONTROL_PORT: "8002"
      SIM_CONTROL_TOKEN: ${SIM_CONTROL_TOKEN}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    read_only: true
    tmpfs: [/tmp]
    mem_limit: 256m
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('127.0.0.1', 8002), 3)"]
      interval: 15s
      timeout: 5s
      retries: 5
    ports:
      - "127.0.0.1:8002:8002"
    volumes:
      - ./infra/mosquitto/certs/ca.crt:/certs/ca.crt:ro
    depends_on:
      mosquitto:
        condition: service_healthy

secrets:
  mqtt_health_password:
    file: ./infra/mosquitto/health.pw
  redis_password:
    file: ./infra/redis/redis.pw

volumes:
  tsdb-data:
  mosquitto-data:
  rabbitmq-data:
  redis-data:
  mosquitto-auth:
    external: true
    name: hastori_mosquitto-auth
