alarm_rules:
  - id: aee4e4e5-1bfd-591f-8f6c-0eeb2bc846b1
    device: izmir-komp-1
    name: Kompresör-1 yüksek sıcaklık
    metric: temperature_c
    operator: ">"
    threshold: 80
    duration_s: 30
    clear_threshold: 75
    severity: critical
  - id: 77c48eb7-b09c-5ef5-b817-fbdc1f116eab
    device: izmir-sogutma-1
    name: Soğutma-1 yüksek akım
    metric: current_a
    operator: ">"
    threshold: 90
    duration_s: 60
    clear_threshold: 85
    severity: warning
  # A device that stops reporting: no temperature for a minute. The thresholds are unused.
  - id: 0d6f2c1a-3b7e-5e0a-9a64-2f1c8b5d7e40
    device: izmir-komp-1
    name: Kompresör-1 veri yok
    kind: no_data
    metric: temperature_c
    operator: ">"
    threshold: 0
    duration_s: 60
    clear_threshold: 0
    severity: warning
  # Reactive / active energy over a sliding 10 minute window (demo assumption: 0.18 warns, below
  # 0.165 it clears). The simulator's normal tan(phi) is 0.12-0.16; compensation_failure is 0.35.
  - id: 5909e820-fdfa-5bae-9b6d-6edd7c1eeb6b
    device: izmir-pano
    name: İzmir pano reaktif oran
    kind: reactive_ratio
    metric: reactive_power_kvar
    operator: ">"
    threshold: 0.18
    duration_s: 0
    clear_threshold: 0.165
    window_s: 600
    severity: warning
  - id: 6ad6a3cc-9e3e-55f0-a86f-cec03f3814a1
    device: antalya-pano
    name: Antalya pano reaktif oran
    kind: reactive_ratio
    metric: reactive_power_kvar
    operator: ">"
    threshold: 0.18
    duration_s: 0
    clear_threshold: 0.165
    window_s: 600
    severity: warning
