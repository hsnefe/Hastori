persistence true
persistence_location /mosquitto/data/
# Write the persistent state often: after a broker crash the queued messages come back as of the
# last save (default 30 minutes).
autosave_interval 60

listener 8883
protocol mqtt
cafile /mosquitto/certs/ca.crt
certfile /mosquitto/certs/server.crt
keyfile /mosquitto/certs/server.key
# No tls_version: Mosquitto 2 negotiates TLS 1.2 and 1.3.

allow_anonymous false
# Written with proper ownership and mode into a named volume by scripts/gen_mqtt_auth.py.
password_file /mosquitto/auth/passwd
acl_file /mosquitto/auth/acl

# The client id becomes the user name. Otherwise any authenticated user (any device) could
# connect with the ingestion client id and take over its persistent session, discarding the
# messages queued for it (open upstream issue: eclipse-mosquitto/mosquitto#3553). The id of a
# session is therefore the MQTT user: a second ingestion replica needs its own user.
use_username_as_clientid true

# Ingestion may be down for a while: let the broker keep its messages instead of dropping
# them at the 1000-message default (~5 minutes at 3.5 msg/s). 200000 is ~16 hours of traffic,
# but the session itself expires after 1 hour (SESSION_EXPIRY_S in ingestion): the queue only
# survives an outage of that length. persistent_client_expiration is the broker-side safety net
# and is kept just above the client's session expiry.
max_queued_messages 200000
max_queued_bytes 0
persistent_client_expiration 2h

# Messages the broker may have in flight to one client before waiting for acks. Ingestion acks
# after each database commit (at most once a second), so throughput is roughly this value per
# second: the default of 20 would cap a backlog replay at ~20 msg/s.
max_inflight_messages 500

# Readings are ~150 bytes. A device authenticated to write its own topic must not be able to
# push megabytes through the parsing path.
message_size_limit 4096
max_connections 200

log_dest stdout
