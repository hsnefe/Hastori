# Scrapes every service on the compose network. Prometheus and Grafana listen on 127.0.0.1 only and
# never go through the public gateway (risk E1): on the demo machine they are reached over SSH.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: ingestion
    static_configs:
      - targets: ["ingestion:8001"]

  - job_name: alarm
    static_configs:
      - targets: ["alarm:8003"]

  - job_name: api
    static_configs:
      - targets: ["api:8000"]

  # The rabbitmq_prometheus plugin (enabled in the management image). /metrics is aggregated over
  # all queues; the per-queue depths come from the detailed endpoint.
  - job_name: rabbitmq
    static_configs:
      - targets: ["rabbitmq:15692"]

  - job_name: rabbitmq-queues
    metrics_path: /metrics/detailed
    params:
      family: [queue_coarse_metrics]
      vhost: ["/"]
    static_configs:
      - targets: ["rabbitmq:15692"]

  - job_name: prometheus
    static_configs:
      - targets: ["127.0.0.1:9090"]
